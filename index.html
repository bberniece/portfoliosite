#site{--i:#1f1522;--m:#6e5b69;--l:rgba(60,30,50,.14);--a:#c42a68;--v:#6d4aff;position:relative;overflow-x:clip;color:var(--i);font:400 16px/1.6 var(--font);background:radial-gradient(60% 40% at 0% 0%,#ffe6ef 0%,transparent 70%),#fbf8fa}
